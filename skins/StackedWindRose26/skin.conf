###############################################################################
#                                                                             #
#  weewx-stackedwindrose26 skin configuration                                 #
#                                                                             #
#  A stacked wind rose for WeeWX 5, rendered in the browser with D3.          #
#  Successor to the StackedWindRose image generator by Gary Roderick.         #
#                                                                             #
#  Version: 1.0.0                                                             #
#                                                                             #
#  Settings here are defaults.  To keep your changes across upgrades, put     #
#  them in weewx.conf under [StdReport] [[StackedWindRose26]] instead, e.g.   #
#                                                                             #
#    [StdReport]                                                              #
#        [[StackedWindRose26]]                                                #
#            [[[StackedWindRose26]]]                                          #
#                speed_bands = 5, 10, 20, 30, 40                              #
#                                                                             #
###############################################################################

[Units]
    [[Groups]]
        # Speed unit for every rose: km_per_hour, mile_per_hour, knot or
        # meter_per_second.  For Beaufort, keep a speed unit here and set
        # speed_bands = beaufort below.
        group_speed = km_per_hour

###############################################################################

[StackedWindRose26]

    # Options in this section apply to every rose below.  Any of them can be
    # repeated inside a rose's own section to override it for that rose.

    # Where the JSON files go, relative to this report's HTML_ROOT.
    data_dir = data

    # Database binding to read wind data from.
    data_binding = wx_binding

    # Number of direction sectors: 8, 16 (default), 32, 36 ... (4 to 72).
    sectors = 16

    # Speed bands.  One of:
    #   auto       - 'auto_bands' bands of a round width, sized so the last
    #                closed band reaches the 99th percentile speed of the
    #                period (bands can differ between periods)
    #   beaufort   - one band per Beaufort force present in the data
    #   a list     - fixed lower band edges in the display unit, e.g.
    #                speed_bands = 5, 10, 20, 30, 40
    #                gives 0-5, 5-10, 10-20, 20-30, 30-40 and >= 40.
    #                Fixed bands make roses comparable across periods.
    speed_bands = auto
    auto_bands = 5

    # Speeds at or below this value (display unit) are counted as calm and
    # shown in the hub rather than in a direction.  0 = only dead calm.
    calm_threshold = 0

    # How each archive record is weighted: 'time' (by its interval, correct
    # when the archive interval has changed over time) or 'samples' (one
    # vote per record, as the original extension did).
    weighting = time

    # Radial scale of the petals: 'linear' (classic) or 'sqrt' (petal area
    # proportional to frequency, so small directions are easier to see).
    radial_scale = linear

    # Petal width as a fraction of its sector (0.2 - 1.0).
    petal_width = 0.85

    # Optional colours, slowest band first.  Leave unset to use the built-in
    # light/dark blue ramp, which adapts to the number of bands and to the
    # viewer's colour scheme.  Any CSS colour works: names, #rrggbb, rgb().
    # petal_colors = "#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"
    # calm_color = "#d4d3cf"

    # strftime format of the "data to" stamp shown under each rose.
    time_stamp = %d %b %Y %H:%M

    # Each subsection is one rose; its name is the JSON file name.
    #   label        title shown on the page and in the period switcher
    #   time_length  seconds of data ending at the report time (rolling), or
    #                one of day, week, month, year for the calendar period
    #   obs          windSpeed (default) or windGust
    #   dir_obs      direction observation (default windDir, or windGustDir
    #                for windGust, falling back to windDir if it is empty)
    #   stale_age    seconds; skip regenerating while the file is younger.
    #                Useful for long periods on slow hardware.

    [[day]]
        label = Last 24 hours
        time_length = 86400

    [[week]]
        label = Last 7 days
        time_length = 604800
        stale_age = 1800

    [[month]]
        label = Last 30 days
        time_length = 2592000
        stale_age = 3600

    [[year]]
        label = Last 365 days
        time_length = 31536000
        stale_age = 10800

    # Example: a gust rose for this calendar month
    # [[gust_month]]
    #     label = Gusts this month
    #     obs = windGust
    #     time_length = month

###############################################################################

[CopyGenerator]
    copy_once = index.html, stackedwindrose26.css, js/*.js

###############################################################################

[Generators]
    generator_list = user.stackedwindrose26.StackedWindRoseGenerator, weewx.reportengine.CopyGenerator
